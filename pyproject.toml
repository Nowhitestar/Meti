[project]
name = "meti"
version = "0.6.0"
description = "One manifest, every Chinese-platform you publish to."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Lewis Liao", email = "yxliao.lewis@gmail.com"}]
keywords = [
    "publishing", "automation", "wechat", "xiaohongshu",
    "substack", "x-articles", "manifest", "claude-code", "openclaw",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Office/Business",
]
dependencies = [
    "pyyaml>=6.0",
    "pyrage>=1.1",
    "tomli_w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Nowhitestar/meti"
Repository = "https://github.com/Nowhitestar/meti"
Issues = "https://github.com/Nowhitestar/meti/issues"
Changelog = "https://github.com/Nowhitestar/meti/blob/main/CHANGELOG.md"

[project.scripts]
meti = "core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
]
# NOTE: Browser-flow providers (x-article, substack, wechat-image) drive
# the user's real Chrome via OpenCLI Browser Bridge. OpenCLI is a
# Node.js CLI (invoked via `npx @jackwener/opencli`), so there's NO
# Python dep needed here. Setup:
#   1. Node.js >= 21 (`brew install node` / `apt install nodejs npm`)
#   2. Chrome extension: https://chromewebstore.google.com/detail/opencli/ildkmabpimmkaediidaifkhjpohdnifk
#   3. Verify: `meti browser status`
# See docs/browser-connectors.md for details.

[tool.setuptools.packages.find]
include = ["core*", "providers*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["core"]


[tool.pytest.ini_options]
testpaths = ["tests", "providers"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
