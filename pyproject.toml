[project]
name = "multi-media-publisher"
version = "0.3.2"
description = "Cross-platform content publishing orchestration."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pyrage>=1.1",
    "tomli_w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
mmp = "core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
]
# NOTE: Browser-flow providers (x-article, substack) drive the user's
# real Chrome via OpenCLI Browser Bridge. OpenCLI is a Node.js CLI
# (invoked via `npx @jackwener/opencli`), so there's NO Python dep
# needed here. Setup:
#   1. Node.js >= 21 (`brew install node` / `apt install nodejs npm`)
#   2. Chrome extension: https://chromewebstore.google.com/detail/opencli/ildkmabpimmkaediidaifkhjpohdnifk
#   3. Verify: `mmp browser status`
# See docs/browser-connectors.md for details.

[tool.setuptools.packages.find]
include = ["core*", "providers*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["core"]


[tool.pytest.ini_options]
testpaths = ["tests", "providers"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
