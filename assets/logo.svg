<svg width="64" height="64" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meti">
  <title>Meti</title>
  <!--
    Five vertical strokes, varying heights, form a stylized "M" silhouette.
    The five strokes also encode the five provider channels Meti drafts to.
    Single-color ember (#A8421A) — matches the project's brand accent.
  -->
  <g fill="#A8421A">
    <rect x="8"  y="12" width="6" height="56" rx="1.5"/>
    <rect x="22" y="22" width="6" height="46" rx="1.5"/>
    <rect x="36" y="32" width="6" height="36" rx="1.5"/>
    <rect x="50" y="22" width="6" height="46" rx="1.5"/>
    <rect x="64" y="12" width="6" height="56" rx="1.5"/>
  </g>
</svg>
